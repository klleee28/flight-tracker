services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerosplit_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/flight_tracker.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerosplit_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
